<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kerala Open World</title>
<style>
:root{--bg:#10202b;--fg:#fff;--card:rgba(10,20,30,.82);--acc:#ff9933}
@media (prefers-color-scheme:dark){:root{--bg:#0b1620}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas#g{display:block;width:100%;height:100%}
.hud{position:fixed;z-index:5}
#top{top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;display:flex;gap:6px}
button{background:var(--card);color:var(--fg);border:1px solid #fff3;border-radius:10px;padding:9px 12px;font-size:14px}
button.on{background:var(--acc);color:#000}
#mini{top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;width:96px;height:96px;border-radius:10px;border:2px solid #fff5}
#joy{left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:110px;height:110px;border-radius:50%;background:#fff2;border:2px solid #fff4}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffa}
.panel{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#000b}
.box{background:var(--card);padding:16px;border-radius:14px;max-width:88vw;text-align:center}
#start{display:flex}
input{padding:10px;border-radius:8px;border:0;font-size:16px;width:70%;margin:10px 0}
#skins button{margin:4px}
#full{background:#000c}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div class="hud" id="top"><button id="bMap">🗺️ മാപ്പ്</button><button id="bSkin">👕 സ്കിൻ</button></div>
<canvas class="hud" id="mini" width="192" height="192"></canvas>
<div class="hud" id="joy"><div id="knob"></div></div>

<div class="hud" id="area" style="top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);font-weight:700;text-shadow:0 1px 3px #000;font-size:15px"></div>
<button class="hud" id="bJ" style="right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:76px;height:76px;border-radius:50%">JUMP</button>
<button class="hud" id="bR" style="right:108px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:62px;height:62px;border-radius:50%">RUN</button>
<div class="panel" id="start"><div class="box"><h2>🌴 Kerala Open World</h2><div>നിങ്ങളുടെ പേര്</div><input id="nm" maxlength="12" value="Player"><br><button id="go" class="on">കളി തുടങ്ങാം</button><p style="font-size:12px;opacity:.7">ഇടത് വശം: നടക്കാൻ · വലത് വശം: ചുറ്റും നോക്കാൻ</p></div></div>
<button class="hud" id="bVeh" style="top:calc(env(safe-area-inset-top,0px) + 56px);left:8px">🏍️ വണ്ടി</button>
<button class="hud on" id="bAct" style="display:none;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 130px);width:104px;height:52px;font-weight:700"></button>
<button class="hud" id="bPet" style="top:calc(env(safe-area-inset-top,0px) + 104px);left:8px">🐾 PET</button>
<button class="hud" id="bChat" style="top:calc(env(safe-area-inset-top,0px) + 152px);left:8px">💬 ചാറ്റ്</button>
<button class="hud" id="bTP" style="top:calc(env(safe-area-inset-top,0px) + 200px);left:8px">📍 TP</button>
<button class="hud" id="bEmo" style="top:calc(env(safe-area-inset-top,0px) + 248px);left:8px">😀 EMOTE</button>
<div class="panel" id="wsel" style="display:none"><div class="box" style="width:92vw;max-width:520px"><h2>🌍 ലോകം തിരഞ്ഞെടുക്കൂ</h2><div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap"><div><canvas id="wpI" width="150" height="150" style="border-radius:10px"></canvas><div style="font-weight:700;margin-top:6px">INDIA OPEN WORLD</div><div style="font-size:12px;opacity:.7;margin-bottom:6px">10 KM × 10 KM</div><button id="goI" class="on">PLAY</button></div><div><canvas id="wpK" width="150" height="150" style="border-radius:10px"></canvas><div style="font-weight:700;margin-top:6px">KERALA OPEN WORLD</div><div style="font-size:12px;opacity:.7;margin-bottom:6px">10 KM × 10 KM</div><button id="goK" class="on">PLAY</button></div></div></div></div>
<div class="panel" id="tpP"><div class="box" style="width:94vw;max-width:480px;max-height:90vh;display:flex;flex-direction:column"><div style="display:flex;gap:10px;align-items:center"><canvas id="tpC" width="150" height="150" style="border-radius:8px"></canvas><div style="flex:1;text-align:left"><div id="tpN" style="font-weight:700;font-size:17px">—</div><div id="tpK" style="font-size:12px;opacity:.7"></div><button id="tpGo" class="on" style="margin-top:8px">TELEPORT</button> <button id="tpX">✕</button></div></div><div id="tpL" style="overflow-y:auto;touch-action:pan-y;margin-top:10px;text-align:left"></div></div></div>
<div class="panel" id="emoP"><div id="wheel" style="position:relative;width:300px;height:300px"></div></div>
<div id="fade" style="position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:20"></div>
<div id="toast" style="position:fixed;left:50%;bottom:30%;transform:translateX(-50%);z-index:15;background:#000a;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none"></div>
<div class="panel" id="petP"><div class="box"><h3>🐾 PET</h3><button id="pCat">🐱 പൂച്ച</button> <button id="pDog">🐶 പട്ടി</button><br><input id="pName" maxlength="12" placeholder="പേര്"><br><button id="pNameB">NAME</button> <button id="pCall">CALL</button> <button id="pOff">DISMISS</button> <button id="pClose" class="on">ശരി</button></div></div>
<div class="panel" id="chatP"><div class="box" style="width:86vw;max-width:420px"><div id="chatLog" style="height:34vh;overflow-y:auto;text-align:left;font-size:14px;touch-action:pan-y"></div><input id="chatIn" maxlength="120" placeholder="message..." style="width:60%"> <button id="chatSend" class="on">SEND</button> <button id="chatX">✕</button></div></div>
<div class="panel" id="vehP"><div class="box"><h3>വണ്ടി സ്പോൺ</h3><div id="vlist"></div><button id="closeV">അടയ്ക്കുക</button></div></div>
<div class="panel" id="skinP"><div class="box"><h3>സ്കിൻ / ഔട്ട്ഫിറ്റ്</h3><div id="skins"></div><button id="capB">🧢 തൊപ്പി</button> <button id="closeS" class="on">ശരി</button></div></div>
<div class="panel" id="full"><canvas id="fc"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const S=345;
const LL=[[68.2,23.7],[69,22.4],[70.5,20.9],[72.8,19],[73.3,16.5],[74.8,13],[76.2,9.5],[77.5,8.1],[78.2,8.8],[79.8,10.3],[80.3,13],[81.5,16],[84,18.5],[86.5,20.3],[88,21.7],[89,22],[91,23],[92.3,22.5],[93,24],[94.5,25],[94.8,26.5],[96.5,28.2],[94,28.5],[91.5,27],[89,26.8],[88.5,27.8],[85,28],[81,30],[79,31.5],[78.5,32.5],[78.8,34.5],[77,35.5],[75,36.9],[74,35],[74.5,34],[74,32.5],[74.5,31.5],[74,30.5],[72,28.5],[70.5,27.5],[70,25.5]];
// ===== KERALA DATA (1 deg = 2070 m; Kerala + neighbouring land as filler) =====
const KS=S*6,G=(lo,la)=>[82.5+(lo-76.1)*6,22+(la-10.5)*6];
const KR=[[74.88,12.75],[74.99,12.5],[75.03,12.39],[75.12,12.25],[75.18,12.1],[75.37,11.87],[75.49,11.75],[75.58,11.6],[75.68,11.44],[75.77,11.25],[75.8,11.1],[75.92,10.77],[76.03,10.55],[76.19,10.23],[76.24,9.97],[76.32,9.49],[76.38,9.28],[76.58,8.88],[76.71,8.73],[76.94,8.5],[76.98,8.38],[77.07,8.3],[77.5,8.18],[77.95,8.2],[77.95,12.95],[75.1,12.95],[74.95,12.85]];
const WORLD=(()=>{let w=null;try{w=sessionStorage.getItem('w')}catch(e){}w=w||location.hash.slice(1);return w=='india'||w=='kerala'?w:null})();
if(!WORLD){const pv=(id,pts)=>{const c=document.getElementById(id),x=c.getContext('2d'),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),a=Math.min(...xs),b=Math.max(...xs),d=Math.min(...ys),e=Math.max(...ys),k=Math.min(130/(b-a),130/(e-d));x.fillStyle='#1b4965';x.fillRect(0,0,150,150);x.fillStyle='#3a7d44';x.beginPath();pts.forEach(([u,v],i)=>{const px=75+(u-(a+b)/2)*k,py=75-(v-(d+e)/2)*k;i?x.lineTo(px,py):x.moveTo(px,py)});x.fill()};
 pv('wpI',LL);pv('wpK',KR);const go=w=>{try{sessionStorage.setItem('w',w)}catch(e){location.hash=w}location.reload()};
 document.getElementById('goI').onclick=()=>go('india');document.getElementById('goK').onclick=()=>go('kerala');document.getElementById('start').style.display='none';document.getElementById('wsel').style.display='flex';throw new Error('world-select')}
const P=WORLD=='india'?LL.map(([lo,la])=>[(lo-82.5)*S,(la-22)*S]):KR.map(([lo,la])=>[(lo-76.1)*KS,(la-10.5)*KS]);
const KC=[['THIRUVANANTHAPURAM',77.05,8.6,-25,0],['KOLLAM',76.75,8.95],['PATHANAMTHITTA',76.85,9.27],['ALAPPUZHA',76.4,9.52],['KOTTAYAM',76.55,9.6],['KOCHI',76.4,9.98,0,25],['THODUPUZHA',76.75,9.9],['KATTAPPANA',77.1,9.75],['MUNNAR',77.08,10.08],['THEKKADY',77.08,9.55],['THRISSUR',76.28,10.52],['PALAKKAD',76.65,10.78],['MALAPPURAM',76.15,11.05],['KOZHIKODE',75.88,11.27],['KALPETTA',76.08,11.6],['KANNUR',75.45,11.88],['KASARAGOD',75.15,12.45]];
const KE=[['THIRUVANANTHAPURAM','KOLLAM','H'],['KOLLAM','ALAPPUZHA','H'],['ALAPPUZHA','KOCHI','H'],['KOCHI','THRISSUR','H'],['THRISSUR','KOZHIKODE','H'],['KOZHIKODE','KANNUR','H'],['KANNUR','KASARAGOD','H'],['THIRUVANANTHAPURAM','PATHANAMTHITTA','H'],['PATHANAMTHITTA','KOTTAYAM','H'],['KOTTAYAM','KOCHI','H'],['KOCHI','THODUPUZHA','H'],['THRISSUR','PALAKKAD','H'],['PALAKKAD','MALAPPURAM','H'],['MALAPPURAM','KOZHIKODE','H'],['KOLLAM','PATHANAMTHITTA','V'],['ALAPPUZHA','KOTTAYAM','V'],['THODUPUZHA','KATTAPPANA','V'],['KATTAPPANA','MUNNAR','V'],['KATTAPPANA','THEKKADY','V'],['KOZHIKODE','KALPETTA','V'],['KANNUR','KALPETTA','V'],['KOTTAYAM','KATTAPPANA','V']];
const GM=a=>a.map(([n,lo,la,...r])=>[n,...G(lo,la),...r]);
const KLM=GM([['PADMANABHASWAMY TEMPLE',77.08,8.58,'padma'],['LULU MALL',76.32,10.03,'lulu'],['MARINE DRIVE',76.3,9.99,'marine'],['FORT KOCHI',76.28,9.955,'fortk',0,10],['ATHIRAPPILLY FALLS',76.57,10.285,'athirap'],['BEKAL FORT',75.07,12.39,'bekal'],['IDUKKI DAM',76.93,10.0,'idukkidam'],['VARKALA CLIFF',76.75,8.735,'varkala'],['PERIYAR LAKE',77.06,9.6,'periyar'],['MUNNAR VIEWPOINT',77.05,10.14,'munnarv'],['ALAPPUZHA LIGHTHOUSE',76.36,9.495,'lighthouse'],['JATAYU EARTH CENTER',76.87,8.82,'jatayu']]);
const KD=GM([['Thiruvananthapuram',77.0,8.65],['Kollam',76.8,8.95],['Pathanamthitta',76.85,9.3],['Alappuzha',76.42,9.5],['Kottayam',76.6,9.6],['Idukki',77.05,9.9],['Ernakulam',76.45,10.05],['Thrissur',76.35,10.5],['Palakkad',76.7,10.75],['Malappuram',76.25,11.0],['Kozhikode',75.95,11.35],['Wayanad',76.1,11.7],['Kannur',75.6,11.95],['Kasaragod',75.2,12.45]]);
const KB=[['Bekal Beach',2],['Kannur Beach',5],['Kozhikode Beach',9],['Fort Kochi Beach',14],['Alappuzha Beach',15],['Varkala Beach',18],['Kovalam Beach',20]];
const KN=GM([['Munnar Tea Gardens',77.0,10.0],['Vagamon Meadows',76.9,9.68],['Thekkady Forest',77.0,9.5],['Wayanad Forest',76.15,11.55],['Kuttanad Backwaters',76.4,9.4],['Palakkad Paddy Fields',76.5,10.7],['Cochin Airport',76.45,10.15],['Trivandrum Airport',77.1,8.52],['Calicut Airport',76.0,11.1],['Kannur Airport',75.58,11.92]]);
function inside(x,z){const n=-z;let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[a,b]=P[i],[d,e]=P[j];if((b>n)!=(e>n)&&x<(d-a)*(n-b)/(e-b)+a)c=!c}return c}
const R=Math.random, GY=4;

const cv=document.getElementById('g');
const ren=new THREE.WebGLRenderer({canvas:cv,antialias:false});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd3f4);scene.fog=new THREE.Fog(0x8fd3f4,150,560);
const cam=new THREE.PerspectiveCamera(60,1,.5,2500);
const hemi=new THREE.HemisphereLight(0xffffff,0x446644,.85);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(50,80,30);scene.add(sun);

// Water + India-shaped highland
const water=new THREE.Mesh(new THREE.PlaneGeometry(40000,40000),new THREE.MeshLambertMaterial({color:0x1b6ca8}));
water.rotation.x=-Math.PI/2;water.position.y=.3;scene.add(water);
const shp=new THREE.Shape();P.forEach(([x,y],i)=>i?shp.lineTo(x,y):shp.moveTo(x,y));
const eg=new THREE.ExtrudeGeometry(shp,{depth:GY,bevelEnabled:false});eg.rotateX(-Math.PI/2);
scene.add(new THREE.Mesh(eg,[new THREE.MeshLambertMaterial({color:0x4c9a45}),new THREE.MeshLambertMaterial({color:0x7a5a3a})]));

// ===== ROAD NETWORK DATA =====
const CITYold=[['DELHI',77.2,28.6,25,0],['AGRA',78.04,27.17,22,22],['JAIPUR',75.82,26.92,20,18],['AHMEDABAD',72.6,23.0],['MUMBAI',72.83,18.95,30,0],['PUNE',73.85,18.5],['BENGALURU',77.6,12.97],['CHENNAI',79.9,13.0],['HYDERABAD',78.47,17.36,22,22],['NAGPUR',79.1,21.15],['BHOPAL',77.4,23.25],['KOLKATA',88.34,22.54,24,22],['LUCKNOW',80.95,26.85],['PATNA',85.1,25.6],['BHUBANESWAR',85.8,20.3],['KOCHI',76.3,9.95],['MYSURU',76.65,12.3,22,22],['MADURAI',78.1,9.9],['CHANDIGARH',76.8,30.7],['SHIMLA',77.17,31.1],['SRINAGAR',74.8,34.1]];
const CITY=WORLD=='india'?CITYold:GM(KC);
const CP={};CITY.forEach(c=>CP[c[0]]=[(c[1]-82.5)*S+(c[3]||0)*4,-(c[2]-22)*S+(c[4]||0)*4]);
const EDGold=[['DELHI','AGRA','H'],['DELHI','JAIPUR','H'],['JAIPUR','AHMEDABAD','H'],['AHMEDABAD','MUMBAI','H'],['MUMBAI','PUNE','H'],['PUNE','BENGALURU','H'],['BENGALURU','CHENNAI','H'],['HYDERABAD','BENGALURU','H'],['HYDERABAD','CHENNAI','H'],['HYDERABAD','NAGPUR','H'],['NAGPUR','BHOPAL','H'],['BHOPAL','AGRA','H'],['DELHI','LUCKNOW','H'],['LUCKNOW','PATNA','H'],['PATNA','KOLKATA','H'],['KOLKATA','BHUBANESWAR','H'],['BHUBANESWAR','NAGPUR','H'],['BHUBANESWAR','CHENNAI','H'],['PUNE','HYDERABAD','H'],['DELHI','CHANDIGARH','H'],['CHANDIGARH','SHIMLA','V'],['CHANDIGARH','SRINAGAR','V'],['BENGALURU','MYSURU','V'],['MYSURU','KOCHI','V'],['KOCHI','MADURAI','V'],['MADURAI','CHENNAI','V'],['BENGALURU','KOCHI','V']];
const EDG=WORLD=='india'?EDGold:KE;
const RD=[];
EDG.forEach(([a,b,t])=>{const p=CP[a],q=CP[b],L=Math.hypot(q[0]-p[0],q[1]-p[1])||1,n=Math.max(2,Math.ceil(L/8)),px=-(q[1]-p[1])/L,pz=(q[0]-p[0])/L;let run=[];
 for(let i=0;i<=n;i++){const w=Math.sin(i*.06+L*.1)*30*Math.sin(Math.PI*i/n),x=p[0]+(q[0]-p[0])*i/n+px*w,z=p[1]+(q[1]-p[1])*i/n+pz*w;
  if(inside(x,z))run.push([x,z]);else{if(run.length>1)RD.push({h:t=='H',pts:run});run=[]}}
 if(run.length>1)RD.push({h:t=='H',pts:run})});
function onRoad(x,z,m){for(const r of RD){const p=r.pts;for(let i=1;i<p.length;i++){const ax=p[i-1][0],az=p[i-1][1],dx=p[i][0]-ax,dz=p[i][1]-az,t=Math.max(0,Math.min(1,((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz||1))),ex=ax+dx*t-x,ez=az+dz*t-z;if(ex*ex+ez*ez<m*m)return true}}return false}
let ly=0,pitch=.5;
const start=WORLD=='india'?{x:-4.5*S,z:S}:{x:(76.45-76.1)*KS,z:-(9.95-10.5)*KS},GRD=new Map();
function col(x,z,r){const k=Math.floor(x/32)+','+Math.floor(z/32);(GRD.get(k)||GRD.set(k,[]).get(k)).push([x,z,r])}
function near(x,z){const a=[],cx=Math.floor(x/32),cz=Math.floor(z/32);for(let i=-1;i<2;i++)for(let j=-1;j<2;j++){const c=GRD.get((cx+i)+','+(cz+j));if(c)a.push(...c)}return a}
function scatter(n,minD){const a=[];let t=0;while(a.length<n&&t++<80000){const x=(R()-.5)*30*S,z=(R()-.5)*30*S;if(inside(x,z)&&Math.hypot(x-start.x,z-start.z)>minD&&!onRoad(x,z,minD?Math.max(minD,6):28))a.push([x,z])}return a}

// Himalaya
scatter(700,0).filter(p=>WORLD=='india'&&-p[1]>8*S).slice(0,28).forEach(([x,z])=>{const h=(8+R()*8)*3,r=(5+R()*3)*3;const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,6),new THREE.MeshLambertMaterial({color:0xdfe7ee}));m.position.set(x,GY+h/2,z);scene.add(m);col(x,z,r*.8)});

// Coconut trees (instanced)
const cN=900,dm=new THREE.Object3D();
const trunkG=new THREE.CylinderGeometry(.14,.26,6,6,8);trunkG.translate(0,3,0);{const p=trunkG.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i);p.setX(i,p.getX(i)+.9*(y/6)*(y/6))}}
const crownG=(()=>{const V=[],I=[];let k=0;for(let f=0;f<9;f++){const a=f/9*6.283+.3,ca=Math.cos(a),sa=Math.sin(a),L=3.6+(f%3)*.4;for(let j=0;j<=5;j++){const t=j/5,r=L*t,y=6+1.1*t-2.6*t*t,w=.5*(1-t*.75),cx=.9+ca*r,cz=sa*r;V.push(cx-sa*w,y,cz+ca*w,cx+sa*w,y,cz-ca*w);if(j>0)I.push(k-2,k-1,k,k-1,k+1,k);k+=2}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(V,3));g.setIndex(I);g.computeVertexNormals();return g})();
const trunks=new THREE.InstancedMesh(trunkG,new THREE.MeshLambertMaterial({color:0x8b6a45}),cN);
const crowns=new THREE.InstancedMesh(crownG,new THREE.MeshLambertMaterial({color:0x2e8b3a,side:THREE.DoubleSide}),cN);
scatter(cN,5).forEach(([x,z],i)=>{col(x,z,.6);dm.position.set(x,GY,z);dm.rotation.set((R()-.5)*.25,R()*6,(R()-.5)*.25);dm.scale.setScalar(.9+R()*.5);dm.updateMatrix();trunks.setMatrixAt(i,dm.matrix);crowns.setMatrixAt(i,dm.matrix)});
scene.add(trunks,crowns);
// Other tropical trees
const oN=300;
const tG=new THREE.CylinderGeometry(.2,.28,2,5);tG.translate(0,1,0);
const lG=new THREE.SphereGeometry(1.5,7,6);lG.translate(0,3.2,0);
const t2=new THREE.InstancedMesh(tG,new THREE.MeshLambertMaterial({color:0x6b4a2b}),oN);
const l2=new THREE.InstancedMesh(lG,new THREE.MeshLambertMaterial({color:0x1f6b2a}),oN);
scatter(oN,5).forEach(([x,z],i)=>{col(x,z,.9);dm.position.set(x,GY,z);dm.rotation.set(0,0,0);dm.scale.setScalar(.8+R()*.7);dm.updateMatrix();t2.setMatrixAt(i,dm.matrix);l2.setMatrixAt(i,dm.matrix)});
scene.add(t2,l2);
